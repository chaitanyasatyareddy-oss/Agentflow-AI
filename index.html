<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentFlow AI — Multi-Agent Collaboration Platform</title>
    <meta name="description" content="One Goal. Multiple AI Minds. One Perfect Result. Real-time multi-agent collaboration powered by Google Gemini." />
    <meta property="og:title" content="AgentFlow AI — Multi-Agent Collaboration Platform" />
    <meta property="og:description" content="Complex Tasks. Intelligent Teams. Better Results. Plan, research, create, review, and deliver with specialized AI agents." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('agentflow_theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FAFAFA] text-zinc-900 dark:bg-[#0B0C0E] dark:text-zinc-100 antialiased selection:bg-blue-500/20 selection:text-blue-400">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
